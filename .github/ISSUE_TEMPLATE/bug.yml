name: Something isn't working
description: A bug, a crash, or Rumi doing something it shouldn't.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes:
      label: Output of `rumi doctor`
      description: Run `rumi doctor` in a terminal and paste the result. It shows your versions and checks, not your documents.
      render: text
    validations: {required: true}
  - type: dropdown
    id: install
    attributes:
      label: How you installed Rumi
      options: [Install script, npm, Downloaded zip, Homebrew, Scoop, From source]
    validations: {required: true}
  - type: input
    id: model
    attributes:
      label: Model
      description: The model the task ran on, if it matters (for example anthropic/claude-sonnet-4-5 or ollama/qwen3).
