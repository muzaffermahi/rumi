name: An idea
description: Something Rumi could do, or do better.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation and the problem, before any solution. "When I…, I want to…, so that…"
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: else
    attributes:
      label: What you do today instead
