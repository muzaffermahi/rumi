name: A model or sign-in problem
description: A provider won't connect, a model fails, or a sign-in doesn't finish.
labels: [models]
body:
  - type: input
    id: provider
    attributes:
      label: Provider and model
      placeholder: openai/gpt-5, ollama/llama3.3, …
    validations: {required: true}
  - type: dropdown
    id: how
    attributes:
      label: How it's connected
      options: [Subscription sign-in, API key, LM Studio, Ollama, Other local server, Shared with Pi]
    validations: {required: true}
  - type: textarea
    id: error
    attributes:
      label: The error, exactly as shown
      render: text
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes:
      label: Output of `rumi doctor`
      render: text
