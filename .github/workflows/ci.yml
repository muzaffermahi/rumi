# Every push and pull request: lint, types, unit and API tests, interface tests and a build, on the three systems
# Rumi supports; then the end-to-end tests in a real browser. No API keys are needed: tests use a scripted model.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:web
      - run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  package:
    name: Packaged build starts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package
      - name: Start the packaged Rumi with only its own Node, then stop it
        shell: bash
        run: node scripts/smoke-package.mjs
      - name: Install with install.sh as a new user would, then start and stop Rumi
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home" SHELL=/bin/zsh RUMI_DATA="$RUNNER_TEMP/data" RUMI_PORT=4498 RUMI_NO_UPDATE_CHECK=1
          mkdir -p "$HOME"
          RUMI_DOWNLOAD_BASE="file://$PWD/release" sh install/install.sh
          grep -F "$HOME/.local/bin" "$HOME/.zshrc"
          "$HOME/.local/bin/rumi" --no-folder --no-open
          "$HOME/.local/bin/rumi" status | grep "is running"
          "$HOME/.local/bin/rumi" stop
